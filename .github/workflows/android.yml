# Builds the Android app (folder sky_android).
#  - every push and pull request: debug APK
#  - a tag like v0.11.0: signed release APK + AAB, attached to a GitHub Release
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

defaults:
  run:
    working-directory: sky_android

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (the SDK is already on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sky-debug-apk
          path: sky_android/app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match versionName in app/build.gradle.kts
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "$TAG" = "$NAME" ] || { echo "Tag $TAG but versionName is $NAME"; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (the SDK is already on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Decode signing key
        env:
          SKY_KEYSTORE_BASE64: ${{ secrets.SKY_KEYSTORE_BASE64 }}
        run: |
          [ -n "$SKY_KEYSTORE_BASE64" ] || { echo "Secret SKY_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$SKY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sky.jks"
      - name: Build signed release APK and AAB
        env:
          SKY_KEYSTORE_FILE: ${{ runner.temp }}/sky.jks
          SKY_KEYSTORE_PASSWORD: ${{ secrets.SKY_KEYSTORE_PASSWORD }}
          SKY_KEY_ALIAS: ${{ secrets.SKY_KEY_ALIAS }}
          SKY_KEY_PASSWORD: ${{ secrets.SKY_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Name the files
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk "../dist/sky-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "../dist/sky-${GITHUB_REF_NAME}.aab"
      - uses: actions/upload-artifact@v4
        with: { name: sky-release, path: dist/* }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
